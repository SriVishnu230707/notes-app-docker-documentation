name: notes-app
services:
  db:
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 256
    logging: &bounded_logging
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env first}
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks: [notes]
  redis:
    cpus: 0.5
    mem_limit: 128m
    pids_limit: 64
    logging: *bounded_logging
    image: redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: [redis-server, --appendonly, 'yes', --maxmemory, 64mb, --maxmemory-policy, noeviction]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [notes]
  migrate:
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 128
    logging: *bounded_logging
    build: ./backend
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: [alembic, upgrade, head]
    environment: &database_environment
      PGHOST: db
      PGPORT: '5432'
      PGDATABASE: ${POSTGRES_DB:?Copy .env.example to .env first}
      PGUSER: ${POSTGRES_USER:?Copy .env.example to .env first}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'
    networks: [notes]
  api:
    cpus: 1.0
    mem_limit: 256m
    pids_limit: 128
    logging: *bounded_logging
    build: ./backend
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      <<: *database_environment
      REDIS_URL: redis://redis:6379/0
    ports:
      - '127.0.0.1:${API_PORT:-8000}:8000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:8000/api/health", timeout=2)']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks: [notes]
  web:
    cpus: 0.5
    mem_limit: 64m
    pids_limit: 128
    logging: *bounded_logging
    build: ./frontend
    security_opt: [no-new-privileges:true]
    ports:
      - '127.0.0.1:${WEB_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [notes]
networks:
  notes:
    driver: bridge
volumes:
  postgres_data:
  redis_data:
